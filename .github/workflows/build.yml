# Builds Miku Library on Windows, Linux and macOS and runs the smoke tests on every push.
name: Build and test

on:
  push:
    branches: [main, 'ci/**']
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 150
    env:
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}\vcpkg-cache
    steps:
      - uses: actions/checkout@v4

      # Every interface text has a translation, with its %1 placeholders intact.
      - name: Check translations
        run: python tools/i18n.py check

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: 6.8.3
          arch: win64_msvc2022_64
          cache: true

      # libtorrent with Boost and OpenSSL takes a long time to build; keep the binaries.
      - name: Restore vcpkg binaries
        uses: actions/cache@v4
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: vcpkg-libtorrent-x64-windows-${{ env.ImageVersion }}
          restore-keys: vcpkg-libtorrent-x64-windows-

      - name: Install libtorrent
        run: |
          New-Item -ItemType Directory -Force $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null
          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" install libtorrent:x64-windows

      - uses: ilammy/msvc-dev-cmd@v1

      # The built-in player's libmpv, over GitHub's file size limit and so not in the
      # repository: the same shinchiro build the release ships, pinned by its hash.
      - name: libmpv
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'mpv-dev.7z'
          Invoke-WebRequest 'https://github.com/shinchiro/mpv-winbuild-cmake/releases/download/20261109/mpv-dev-x86_64-20261109-git-8bc468896e.7z' -OutFile $archive
          if ((Get-FileHash $archive -Algorithm SHA256).Hash -ne '4E888424015F7146893D03C4D40E2AAF9474D8D47E761BCC6A97489008A7E425') { throw 'libmpv archive hash mismatch' }
          7z e $archive libmpv-2.dll -othird_party/mpv -y | Out-Null
          if (-not (Test-Path third_party/mpv/libmpv-2.dll)) { throw 'libmpv-2.dll missing from the archive' }

      # Motion interpolation that needs nothing installed. assemble_vapoursynth.py checks
      # each official archive against its published hash before using it.
      - name: Motion interpolation set
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'vapoursynth-archives'
          New-Item -ItemType Directory -Force $dir | Out-Null
          $urls = 'https://github.com/vapoursynth/vapoursynth/releases/download/R82/VapourSynth64-Portable-R82.zip',
                  'https://www.python.org/ftp/python/3.13.15/python-3.13.15-embed-amd64.zip',
                  'https://files.pythonhosted.org/packages/28/f5/1697a4c7238f442a24982a3e5b7b4cbc54d411b40bf3f83b955ab0ed3cc2/vapoursynth_mvtools-29-py3-none-win_amd64.whl'
          foreach ($url in $urls) { Invoke-WebRequest $url -OutFile (Join-Path $dir ($url -split '/')[-1]) }
          python tools/assemble_vapoursynth.py $dir

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR"
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
          -DVCPKG_TARGET_TRIPLET=x64-windows

      - name: Build
        run: |
          cmake --build build --parallel 2>&1 | Tee-Object -FilePath build-output.txt
          if ($LASTEXITCODE -ne 0) {
            Select-String -Path build-output.txt -Pattern ' error |error:|FAILED' | Select-Object -First 12 | ForEach-Object { Write-Host "::error::$($_.Line)" }
            exit 1
          }

      # The runner's screen is 1024 x 768; the interface suite sizes its window up to
      # 2400 px wide, as the Linux job's 1920 x 1080 virtual screen allows.
      - name: Screen size
        run: |
          Set-DisplayResolution -Width 1920 -Height 1080 -Force
          Add-Type -AssemblyName System.Windows.Forms
          Write-Host "::notice title=screen::$([System.Windows.Forms.Screen]::PrimaryScreen.Bounds)"

      - name: Smoke tests
        working-directory: build
        run: |
          $env:PATH = "$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows\bin;$env:PATH"
          $tests = "DetailLibrarySmoke","DirectorySmoke","DownloadSmoke","ExternalDownloaderSmoke","LocalLibrarySmoke",
                   "OptimizationSmoke","QuickUiSmoke","RpcSmoke","SettingsLimitsSmoke"
          $failed = @()
          foreach ($test in $tests) {
            $start = Get-Date
            $process = Start-Process ".\$test.exe" -ArgumentList "--test" -PassThru -NoNewWindow
            $null = $process.Handle   # keeps the exit code readable after the process ends
            if (-not $process.WaitForExit(600000)) { $process.Kill(); $failed += "$test (timeout)"; continue }
            $log = Get-ChildItem *.log | Where-Object LastWriteTime -ge $start | Sort-Object LastWriteTime | Select-Object -Last 1
            $passed = if ($log) { (Select-String -Path $log.FullName -Pattern ' PASS$').Count } else { 0 }
            Write-Host "$test exit=$($process.ExitCode) passed=$passed"
            if ($process.ExitCode -ne 0) {
              $failed += $test
              if ($log) {
                Select-String -Path $log.FullName -Pattern ' FAIL$' | ForEach-Object { Write-Host "::error title=$test::$($_.Line)" }
                # QML warnings are written to the log as they are, without PASS or FAIL.
                Get-Content $log.FullName | Where-Object { $_ -notmatch ' (PASS|FAIL)$' -and $_ -match 'qrc:/|QML' } | Select-Object -First 5 | ForEach-Object { Write-Host "::warning title=$test::$_" }
              }
            }
          }
          if ($failed) { Write-Error "Failed: $($failed -join ', ')"; exit 1 }

      - name: Upload test logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test-logs
          path: build/*.log

  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      # Ubuntu 24.04 has libtorrent 2.0.10 (22.04's 2.0.5 is too old) and mpv 0.37.
      - name: Install libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ninja-build libtorrent-rasterbar-dev libboost-dev libssl-dev libmpv-dev             libgl1-mesa-dev libegl1-mesa-dev libxkbcommon-dev libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4             libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxcb-shape0 xvfb fonts-noto-cjk

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: 6.8.3
          arch: linux_gcc_64
          cache: true

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR"

      - name: Build
        run: |
          set +e
          cmake --build build --parallel 2>&1 | tee build-output.txt
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            grep -E 'error:|FAILED' build-output.txt | head -12 | while IFS= read -r line; do echo "::error::$line"; done
            exit "$code"
          fi

      # The interface suite needs a display and OpenGL: Xvfb with Mesa's software renderer.
      - name: Smoke tests
        run: xvfb-run -a -s "-screen 0 1920x1080x24" bash tools/run_smoke.sh build

      - name: Install tree
        run: |
          DESTDIR=$PWD/stage cmake --install build --prefix /usr
          tar -C stage -czf miku-library-linux-x86_64.tar.gz .

      - uses: actions/upload-artifact@v4
        with:
          name: miku-library-linux-x86_64
          path: miku-library-linux-x86_64.tar.gz

      - name: Upload test logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test-logs-linux
          path: build/*.log

  # macOS 15: GitHub retired the macOS 14 image, and Homebrew's libraries, built for the
  # runner's system, make 15 the oldest the app runs on anyway; MVTools needs it as well.
  macos:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Install libraries
        run: brew install ninja libtorrent-rasterbar mpv dylibbundler

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: 6.8.3
          arch: clang_64
          cache: true

      # The bundle icon, from the same 1024 px logo as everywhere else.
      - name: App icon
        run: |
          mkdir -p AppIcon.iconset
          for size in 16 32 128 256 512; do
            sips -z $size $size assets/logo.png --out AppIcon.iconset/icon_${size}x${size}.png >/dev/null
            sips -z $((size * 2)) $((size * 2)) assets/logo.png --out AppIcon.iconset/icon_${size}x${size}@2x.png >/dev/null
          done
          iconutil -c icns AppIcon.iconset -o assets/macos/AppIcon.icns

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR;$(brew --prefix)"

      - name: Build
        run: |
          set +e
          cmake --build build --parallel 2>&1 | tee build-output.txt
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            grep -E 'error:|FAILED' build-output.txt | head -12 | while IFS= read -r line; do echo "::error::$line"; done
            exit "$code"
          fi

      # Motion interpolation that needs nothing installed: a relocatable Python with
      # VapourSynth and MVTools, every download pinned by its published hash. It goes beside
      # the test programs here and into the bundle's Resources below.
      - name: Motion interpolation set
        run: |
          set -euo pipefail
          python_url='https://github.com/astral-sh/python-build-standalone/releases/download/20261110/cpython-3.13.18%2B20261110-aarch64-apple-darwin-install_only_stripped.tar.gz'
          curl -sfL -o "$RUNNER_TEMP/python.tar.gz" "$python_url"
          echo "7a2384641584ab9984221fcb0fc9265df465922af71be71410529e2a9c3f0540  $RUNNER_TEMP/python.tar.gz" | shasum -a 256 -c
          rm -rf build/vapoursynth && mkdir -p build/vapoursynth
          tar -xzf "$RUNNER_TEMP/python.tar.gz" -C build/vapoursynth
          root="$PWD/build/vapoursynth/python"
          echo 'vapoursynth==82 --hash=sha256:e6f0854e7de85b42426cb0889066c712455b6f1afde8d7328addfb2320bc3e80' > "$RUNNER_TEMP/requirements.txt"
          echo 'vapoursynth-mvtools==29 --hash=sha256:c081fb4b367ebd44f2b56cf38e43ff146dd5f31ec31dacbf6cd8bf6560aa2478' >> "$RUNNER_TEMP/requirements.txt"
          "$root/bin/python3" -m pip install -q --no-deps --require-hashes --only-binary=:all: -r "$RUNNER_TEMP/requirements.txt"
          # Only what playback needs: no pip, tests, Tk, headers or cached bytecode.
          cd "$root"
          rm -rf include share bin/pip* bin/idle* bin/pydoc* bin/2to3* bin/vspipe bin/vapoursynth
          rm -rf lib/libtcl* lib/libtk* lib/tcl* lib/tk* lib/itcl* lib/thread*
          rm -rf lib/python3.13/test lib/python3.13/idlelib lib/python3.13/tkinter lib/python3.13/turtledemo
          rm -rf lib/python3.13/ensurepip lib/python3.13/pydoc_data lib/python3.13/lib-dynload/_tkinter*
          rm -rf lib/python3.13/site-packages/pip lib/python3.13/site-packages/pip-*
          rm -rf lib/python3.13/site-packages/vapoursynth/include lib/python3.13/site-packages/vapoursynth/pkgconfig
          find . -name __pycache__ -type d -prune -exec rm -rf {} +
          "$root/bin/python3" -I -c 'from vapoursynth import core; assert hasattr(core, "mv")'
          echo "Motion interpolation set: $(du -sh "$root/.." | cut -f1)"

      # The download suite seeds from 127.0.0.2, which macOS does not configure by itself.
      - name: Smoke tests
        run: |
          sudo ifconfig lo0 alias 127.0.0.2 up
          MIKU_LIBRARY_MPV_LOG="$PWD/build/mpv.log" bash tools/run_smoke.sh build

      # What mpv said about drawing, while the macOS picture is checked to be black.
      - name: mpv log
        if: always()
        run: |
          [ -f build/mpv.log ] || exit 0
          grep -i -E 'opengl|gl_|libmpv|render|error|fail|fbo|vo/' build/mpv.log | grep -v -i 'option' | head -40 | paste -sd '|' - | fold -w 1800 | head -8 | while IFS= read -r line; do echo "::notice title=mpv::$line"; done

      # Qt and libtorrent go in by macdeployqt; libmpv is loaded at run time, so it and
      # everything it needs are copied in separately.
      - name: Bundle
        run: |
          app="build/Miku Library.app"
          mkdir -p "$app/Contents/Frameworks"
          cp "$(brew --prefix)/lib/libmpv.2.dylib" "$app/Contents/Frameworks/"
          chmod u+w "$app/Contents/Frameworks/libmpv.2.dylib"
          dylibbundler -of -b -x "$app/Contents/Frameworks/libmpv.2.dylib" -d "$app/Contents/Frameworks" -p @executable_path/../Frameworks/
          "$QT_ROOT_DIR/bin/macdeployqt" "$app" -qmldir=qml -always-overwrite
          ditto build/vapoursynth "$app/Contents/Resources/vapoursynth"
          ditto -c -k --keepParent "$app" MikuLibrary-macOS-arm64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: miku-library-macos-arm64
          path: MikuLibrary-macOS-arm64.zip

      - name: Upload test logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test-logs-macos
          path: build/*.log
